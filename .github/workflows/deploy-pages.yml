name: Deploy public library to Pages

# THE PUSH TRIGGER IS OFF WHILE THE APPLICATION IS BUILT — Doug, 2026-08-14:
# "No deploy. Leave the teaser." This workflow builds library/.public/app, which
# is the folder F is rebuilding, so a push to main would publish a building site
# over the teaser. Restoring `push: branches: [main]` is G's, alongside the
# deep-link fallback. See library/.public/.lib/projection/15-the-build.md.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build chemistry
        working-directory: library/chemistry/package
        run: npm run build

      - name: Build lib
        working-directory: library/.public/package
        run: npm run build

      - name: Build public library app
        working-directory: library/.public/app
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: library/.public/app/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
