name: Deploy the public library to Pages

# THE SITE IS COMMITTED AS IT IS BOUND, and this publishes what was committed: nothing is built here.
# The library at library/.public is bound locally by the binder copy at library/.public/..public/.binding,
# which leaves the site beside itself under the base /inexplicable-phenomena/ that its .pubconfig names,
# so the committed site and the published one are byte for byte the same. Sprint 119, D2, D3 and D7.
#
# THE PUSH TRIGGER STAYS OFF until Doug says otherwise; a deploy is run by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # THE SITE WITHOUT ITS BINDING: the binder copy stands inside the site folder and is not a page.
      - name: Gather the site
        run: |
          mkdir -p site
          rsync -a --exclude '.binding' 'library/.public/..public/' site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
