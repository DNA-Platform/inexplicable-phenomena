name: Deploy the public library to Pages

# THE SITE IS COMMITTED AS IT IS BOUND, and this publishes what was committed: nothing is built here.
# The library at library/ is bound locally by the binder copy at library/.public/.binding, which
# leaves the site beside itself under the base /inexplicable-phenomena/ that its .pubconfig names,
# so the committed site and the published one are byte for byte the same. Sprint 119, D2, D3 and D7;
# the library's root moved up from library/.public to library/ in Sprint 120, and its face from ..public to .public, where the public package and its .lib also stand, so the gather leaves those two out.
#
# THE PUSH TRIGGER IS ON since 2026-11-10, Sprint 125, on Doug's "are we releasing this as the github
# pages yet? We should be. We want to be." — it stayed off from his "No deploy. Leave the teaser" of
# 2026-08-14 until then. A push to main that changes the committed site publishes it; the binding, the
# package and the branch library are not the site and do not trigger a deploy. A deploy can still be
# run by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - 'library/.public/**'
      - '!library/.public/.binding/**'
      - '!library/.public/package/**'
      - '!library/.public/.lib/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # THE SITE WITHOUT ITS BINDING: the binder copy stands inside the site folder and is not a page.
      - name: Gather the site
        run: |
          mkdir -p site
          rsync -a --exclude '.binding' --exclude 'package' --exclude '.lib' 'library/.public/' site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
