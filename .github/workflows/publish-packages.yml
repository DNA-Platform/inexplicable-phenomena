name: Publish packages

on:
  push:
    branches: [main]
    paths:
      - 'library/chemistry/package/src/**'
      - 'library/chemistry/package/package.json'
      - 'library/.public/package/src/**'
      - 'library/.public/package/package.json'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install

      - name: Build chemistry
        working-directory: library/chemistry/package
        run: npm run build

      - name: Publish chemistry
        working-directory: library/chemistry/package
        run: npm publish --access public --provenance || echo "Version already published, skipping"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build lib
        working-directory: library/.public/package
        run: npm run build

      - name: Publish lib
        working-directory: library/.public/package
        run: npm publish --access public --provenance || echo "Version already published, skipping"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
