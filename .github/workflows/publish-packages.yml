name: Publish packages

on:
  push:
    branches: [main]
    paths:
      - 'library/chemistry/package/src/**'
      - 'library/chemistry/package/package.json'
      - 'library/.public/package/src/**'
      - 'library/.public/package/package.json'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@dna-platform'

      # THE REPOSITORY'S OWN PACKAGES. Every library here consumes @dna-platform/public and
      # @dna-platform/chemistry from GitHub Packages — the registry a library's .npmrc already
      # names — so this is where they are published, and a library updates by installing a version
      # rather than by reaching into a checkout. GitHub's own GITHUB_TOKEN authorises it, which is
      # what `packages: write` above grants and why no npm credential is needed. Provenance and
      # trusted publishing are npmjs features and have no counterpart here.
      - run: npm install

      - name: Build chemistry
        working-directory: library/chemistry/package
        run: npm run build

      - name: Publish chemistry
        working-directory: library/chemistry/package
        run: npm publish || echo "Version already published, skipping"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build lib
        working-directory: library/.public/package
        run: npm run build

      - name: Publish lib
        working-directory: library/.public/package
        run: npm publish || echo "Version already published, skipping"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
